[project]
name = "pf-statsbomb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Captain-Ruben" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "prefect>=3.8.8",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.6",
    "pyarrow>=26.0.0",
    "sqlalchemy>=2.1.5",
    "statsbombpy>=1.22.0",
]

[project.scripts]
pf-statsbomb = "pf_statsbomb:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
